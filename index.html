<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061019">
  <meta name="description" content="TalentX current-first virtual talent market prototype with explainable pricing and virtual trading.">
  <title>TalentX — The Market for Talent</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./discovery-profile.css">
  <link rel="stylesheet" href="./assets/trading-experience.css">
  <style>
    .price-why-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#eef7ff;border-radius:999px;padding:5px 11px;font:inherit;font-size:.78rem;font-weight:750;cursor:pointer;margin-left:8px;vertical-align:middle}.price-change-row{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex-wrap:wrap}.why-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}.why-sheet{width:min(430px,100%);background:#0c1823;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.5);color:#eef7ff}.why-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.why-head h2{font-size:1.15rem;margin:0}.why-close{border:0;background:transparent;color:#aab8c5;font-size:1.5rem;cursor:pointer}.why-title{font-size:1.08rem;font-weight:800;margin-bottom:10px}.why-points{margin:0;padding-left:21px;color:#c4d0da;line-height:1.6}.why-result{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-weight:800}.why-up{color:#58ef78}.why-down{color:#ff7289}.why-updated{display:block;color:#8796a4;font-size:.78rem;font-weight:500;margin-top:7px}.why-details{margin-top:13px;border:0;background:transparent;color:#8abfff;font-weight:750;padding:0;cursor:pointer}.why-detail-box{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);color:#b9c6d1;font-size:.84rem;line-height:1.55}.why-detail-box.open{display:block}@media(max-width:700px){.why-overlay{align-items:flex-end;padding:0}.why-sheet{border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}.profile-price .price-change-row{justify-content:flex-start}}
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand" onclick="go('dashboard')" role="button" tabindex="0" aria-label="Go to TalentX dashboard">
      <img class="brand-logo" src="./assets/talentx-logo.png" alt="TalentX logo">
      <div class="brand-copy"><strong>TalentX</strong><small>THE MARKET FOR TALENT</small></div>
    </div>
    <nav class="nav">
      <button data-route="dashboard" onclick="go('dashboard')">⌂ <span>Dashboard</span></button>
      <button data-route="market" onclick="go('market')">⌁ <span>Market</span></button>
      <button data-route="portfolio" onclick="go('portfolio')">▣ <span>Portfolio</span></button>
      <button data-route="watchlist" onclick="go('watchlist')">☆ <span>Watchlist</span></button>
      <button data-route="rules" onclick="go('rules')">◎ <span>Data & Rules</span></button>
    </nav>
    <div class="account-card"><small>VIRTUAL CASH</small><strong id="sideCash">$25,000.00</strong><span>Prototype only · no real money</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search names, teams, tickers, leagues, and positions…"></div>
      <div class="top-actions"><span class="status-dot"></span><span class="top-label">Current-first catalog</span><img class="user-avatar user-avatar-logo" src="./assets/favicon-32.png" alt="TalentX"></div>
    </header>
    <div id="app" class="content"><div class="loading">Loading TalentX…</div></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="./app.js"></script>
<script src="./chart-history.js"></script>
<script src="./discovery-profile.js"></script>
<script src="./assets/trading-experience.js"></script>
<script src="./assets/price-why.js"></script>
</body>
</html>
