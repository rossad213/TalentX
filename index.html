<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061019">
  <meta name="description" content="TalentX current-first virtual talent market prototype with explainable rookie IPO pricing.">
  <title>TalentX — Current Talent Market & Rookie IPO</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .price-why-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#eef7ff;border-radius:999px;padding:5px 11px;font:inherit;font-size:.78rem;font-weight:750;cursor:pointer;margin-left:8px;vertical-align:middle}
    .price-why-btn:hover,.price-why-btn:focus-visible{background:rgba(255,255,255,.13);outline:none}
    .price-change-row{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex-wrap:wrap}
    .why-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px}
    .why-sheet{width:min(430px,100%);background:#0c1823;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.5);color:#eef7ff}
    .why-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.why-head h2{font-size:1.15rem;margin:0}.why-close{border:0;background:transparent;color:#aab8c5;font-size:1.5rem;cursor:pointer;padding:2px 7px}
    .why-title{font-size:1.08rem;font-weight:800;margin-bottom:10px}.why-points{margin:0;padding-left:21px;color:#c4d0da;line-height:1.6}.why-result{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-weight:800}.why-up{color:#58ef78}.why-down{color:#ff7289}.why-updated{display:block;color:#8796a4;font-size:.78rem;font-weight:500;margin-top:7px}.why-details{margin-top:13px;border:0;background:transparent;color:#8abfff;font-weight:750;padding:0;cursor:pointer}.why-detail-box{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);color:#b9c6d1;font-size:.84rem;line-height:1.55}.why-detail-box.open{display:block}
    @media(max-width:700px){.why-overlay{align-items:flex-end;padding:0}.why-sheet{border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}.profile-price .price-change-row{justify-content:flex-start}}
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand" onclick="go('dashboard')" role="button" tabindex="0" aria-label="Go to TalentX dashboard">
      <img class="brand-logo" src="./assets/talentx-logo.png" alt="TalentX logo">
      <div class="brand-copy"><strong>TalentX</strong><small>THE MARKET FOR TALENT</small></div>
    </div>
    <nav class="nav">
      <button data-route="dashboard" onclick="go('dashboard')">⌂ <span>Dashboard</span></button>
      <button data-route="market" onclick="go('market')">⌁ <span>Market</span></button>
      <button data-route="portfolio" onclick="go('portfolio')">▣ <span>Portfolio</span></button>
      <button data-route="watchlist" onclick="go('watchlist')">☆ <span>Watchlist</span></button>
      <button data-route="rules" onclick="go('rules')">◎ <span>Data & Rules</span></button>
    </nav>
    <div class="account-card">
      <small>VIRTUAL CASH</small>
      <strong id="sideCash">$25,000.00</strong>
      <span>Prototype only · no real money</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="global-search">
        <span>⌕</span>
        <input id="globalSearch" type="search" placeholder="Search names, sports, leagues, genres, platforms…">
      </div>
      <div class="top-actions">
        <span class="status-dot"></span>
        <span class="top-label">Current-first catalog</span>
        <img class="user-avatar user-avatar-logo" src="./assets/favicon-32.png" alt="TalentX">
      </div>
    </header>
    <div id="app" class="content">
      <div class="loading">Loading TalentX…</div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="./app.js"></script>
<script src="./chart-history.js"></script>
<script>
(function(){
  const html=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const prettyKey=key=>String(key||'').replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
  function explanation(record){
    const move=Number(record?.lastGameMovePct ?? record?.dailyChange ?? 0);
    const delta=Number(record?.lastGamePerformanceDeltaPct ?? 0);
    const event=String(record?.lastPriceEvent||'').trim();
    const eventLower=event.toLowerCase();
    let title='No recent price-changing event';
    let points=['The price stayed the same because no supported event was recorded.'];
    if(event){
      if(eventLower.includes('injur')){title='Injury update';points=['Expected availability changed.'];}
      else if(eventLower.includes('trade')||eventLower.includes('signed')||eventLower.includes('free agent')){title='Career update';points=['The player’s market outlook changed.'];}
      else if(eventLower.includes('award')||eventLower.includes('mvp')||eventLower.includes('all-star')||eventLower.includes('champion')){title='Major achievement';points=['A verified career achievement affected the price.'];}
      else if(move>0){title='Strong game performance';points=[delta>1?'Played better than expected.':'Performance supported a positive move.'];}
      else if(move<0){title='Below expectations';points=[delta<-1?'Performance was below expectations.':'Performance supported a negative move.'];}
      else {title='Completed game';points=['The event was reviewed, but it did not create a meaningful price move.'];}
      const won=record?.lastGameStats?.teamWon;
      if(won===true) points.push('Team won.');
      if(won===false) points.push('Team lost.');
    }
    const date=record?.lastPriceEventAt?new Date(record.lastPriceEventAt):null;
    const updated=date&&!Number.isNaN(date.getTime())?date.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'No event time available';
    const stats=Object.entries(record?.lastGameStats||{}).filter(([,v])=>Number.isFinite(Number(v))).slice(0,7);
    return {move,title,points,updated,event,stats};
  }
  function closeWhy(){document.querySelector('.why-overlay')?.remove();}
  window.closePriceWhy=closeWhy;
  window.togglePriceWhyDetails=function(){document.querySelector('.why-detail-box')?.classList.toggle('open');};
  window.openPriceWhy=function(){
    let record=null;
    try{record=typeof byId==='function'&&typeof selectedId!=='undefined'?byId(selectedId):null;}catch{}
    if(!record)return;
    closeWhy();
    const x=explanation(record),up=x.move>=0;
    const result=Math.abs(x.move)<.005?'Price did not change.':`Price ${up?'increased':'decreased'} ${Math.abs(x.move).toFixed(2)}%.`;
    const details=x.stats.length?x.stats.map(([k,v])=>`${html(prettyKey(k))}: ${html(Number(v).toFixed(Number(v)%1?1:0))}`).join(' · '):'No additional box-score details are available.';
    const overlay=document.createElement('div');overlay.className='why-overlay';overlay.setAttribute('role','presentation');
    overlay.innerHTML=`<section class="why-sheet" role="dialog" aria-modal="true" aria-label="Why did the price change?"><div class="why-head"><h2>Why did it change?</h2><button class="why-close" onclick="closePriceWhy()" aria-label="Close">×</button></div><div class="why-title">${html(x.title)}</div><ul class="why-points">${x.points.map(p=>`<li>${html(p)}</li>`).join('')}</ul><div class="why-result ${up?'why-up':'why-down'}">${html(result)}<span class="why-updated">Last updated: ${html(x.updated)}</span></div>${x.event||x.stats.length?`<button class="why-details" onclick="togglePriceWhyDetails()">View details</button><div class="why-detail-box">${x.event?`<strong>${html(x.event)}</strong><br>`:''}${details}</div>`:''}</section>`;
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeWhy();});document.body.appendChild(overlay);overlay.querySelector('.why-close')?.focus();
  };
  function addWhy(){
    const price=document.querySelector('.profile-price');if(!price||price.querySelector('.price-why-btn'))return;
    const change=price.querySelector('span');if(!change)return;
    const row=document.createElement('div');row.className='price-change-row';change.replaceWith(row);row.appendChild(change);
    const button=document.createElement('button');button.type='button';button.className='price-why-btn';button.textContent='Why?';button.setAttribute('aria-label','Explain this price change');button.onclick=window.openPriceWhy;row.appendChild(button);
  }
  new MutationObserver(addWhy).observe(document.getElementById('app'),{childList:true,subtree:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWhy();});
  addWhy();
})();
</script>
</body>
</html>
