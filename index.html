<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061019">
  <meta name="description" content="TalentX current-first virtual talent market prototype with explainable rookie IPO pricing.">
  <title>TalentX — Current Talent Market & Rookie IPO</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand" onclick="go('dashboard')" role="button" tabindex="0">
      <div class="brand-mark">TX</div>
      <div><strong>TalentX</strong><small>THE MARKET FOR TALENT</small></div>
    </div>
    <nav class="nav">
      <button data-route="dashboard" onclick="go('dashboard')">⌂ <span>Dashboard</span></button>
      <button data-route="market" onclick="go('market')">⌁ <span>Market</span></button>
      <button data-route="portfolio" onclick="go('portfolio')">▣ <span>Portfolio</span></button>
      <button data-route="watchlist" onclick="go('watchlist')">☆ <span>Watchlist</span></button>
      <button data-route="rules" onclick="go('rules')">◎ <span>Data & Rules</span></button>
    </nav>
    <div class="account-card">
      <small>VIRTUAL CASH</small>
      <strong id="sideCash">$25,000.00</strong>
      <span>Prototype only · no real money</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="global-search">
        <span>⌕</span>
        <input id="globalSearch" type="search" placeholder="Search names, sports, leagues, genres, platforms…">
      </div>
      <div class="top-actions">
        <span class="status-dot"></span>
        <span class="top-label">Current-first catalog</span>
        <div class="user-avatar">TX</div>
      </div>
    </header>
    <div id="app" class="content">
      <div class="loading">Loading TalentX…</div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="./app.js"></script>
</body>
</html>
