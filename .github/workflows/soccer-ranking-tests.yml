name: Soccer ranking tests

on:
  pull_request:
    paths:
      - "scripts/pricing_engine_v2.py"
      - "scripts/soccer_metric_calibration.py"
      - "scripts/migrate_soccer_global_market_state.py"
      - "scripts/reconcile_soccer_baseline_identities.py"
      - "scripts/same_category_identity_dedupe.py"
      - "scripts/category_market_store.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_soccer_metric_calibration.py"
      - "tests/test_soccer_global_market_state_migration.py"
      - "tests/test_soccer_baseline_identity_reconciliation.py"
      - "tests/test_same_category_identity_dedupe.py"
      - "tests/test_category_market_store.py"
      - ".github/workflows/soccer-ranking-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/pricing_engine_v2.py"
      - "scripts/soccer_metric_calibration.py"
      - "scripts/migrate_soccer_global_market_state.py"
      - "scripts/reconcile_soccer_baseline_identities.py"
      - "scripts/same_category_identity_dedupe.py"
      - "scripts/category_market_store.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_soccer_metric_calibration.py"
      - "tests/test_soccer_global_market_state_migration.py"
      - "tests/test_soccer_baseline_identity_reconciliation.py"
      - "tests/test_same_category_identity_dedupe.py"
      - "tests/test_category_market_store.py"
      - ".github/workflows/soccer-ranking-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Run Soccer ranking regression suite
        run: >-
          python -m unittest
          tests/test_pricing_engine_v2.py
          tests/test_soccer_metric_calibration.py
          tests/test_soccer_global_market_state_migration.py
          tests/test_soccer_baseline_identity_reconciliation.py
          tests/test_same_category_identity_dedupe.py
          tests/test_category_market_store.py
          -v
