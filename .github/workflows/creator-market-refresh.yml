name: Creator market refresh

on:
  workflow_run:
    workflows: ["Build current catalog baseline"]
    types: [completed]
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: talentx-creator-market
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build Creator-owned state from latest baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _baseline _prior
          mkdir -p _baseline _prior data/market
          baseline_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-current-catalog-and-pages.yml/runs?status=success&per_page=1")"
          baseline_id="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].id // empty')"
          baseline_time="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          test -n "$baseline_id" || { echo "No successful full-catalog baseline exists."; exit 1; }
          gh run download "$baseline_id" -R "$GITHUB_REPOSITORY" -n talentx-current-catalog -D _baseline
          baseline_catalog="$(find _baseline -name current_catalog.json -print -quit)"
          test -n "$baseline_catalog" || { echo "Baseline artifact missing current_catalog.json"; exit 1; }
          python scripts/category_market_store.py extract --catalog "$baseline_catalog" --category creators --output data/market/creators.json
          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/creator-market-refresh.yml/runs?status=success&per_page=1")"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty')"
          prior_time="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-creator-market -D _prior || true
            prior_state="$(find _prior -name creators.json -print -quit)"
            if [ -n "$prior_state" ]; then
              if [ -n "$prior_time" ] && [ "$prior_time" \> "$baseline_time" ]; then
                cp "$prior_state" data/market/creators.json
              else
                python scripts/category_market_store.py merge --base data/market/creators.json --overlay "$prior_state" --category creators --mode market
              fi
            fi
          fi
      - name: Validate category state utility
        run: python -m unittest tests/test_category_market_store.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-creator-market
          path: data/market/creators.json
          retention-days: 14
