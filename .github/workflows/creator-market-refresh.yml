name: Creator market refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/creator-market-refresh.yml"
      - "scripts/creator_attention_refresh.py"
      - "scripts/discover_creators_only.py"
      - "scripts/expand_creator_market.py"
      - "scripts/append_game_event_history.py"
      - "scripts/append_price_history.py"
      - "scripts/category_market_store.py"
      - "tests/test_creator_attention_refresh.py"
      - "tests/test_discover_creators_only.py"
      - "tests/test_category_market_store.py"
  workflow_run:
    workflows: ["Build current catalog baseline"]
    types: [completed]
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: talentx-creator-market
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Build Creator-owned state from latest baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _baseline _prior
          mkdir -p _baseline _prior data/market
          baseline_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-current-catalog-and-pages.yml/runs?status=success&per_page=1")"
          baseline_id="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].id // empty')"
          baseline_time="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          test -n "$baseline_id" || { echo "No successful full-catalog baseline exists."; exit 1; }
          gh run download "$baseline_id" -R "$GITHUB_REPOSITORY" -n talentx-current-catalog -D _baseline
          baseline_catalog="$(find _baseline -name current_catalog.json -print -quit)"
          test -n "$baseline_catalog" || { echo "Baseline artifact missing current_catalog.json"; exit 1; }
          cp "$baseline_catalog" data/baseline_current_catalog.json
          python scripts/category_market_store.py extract --catalog "$baseline_catalog" --category creators --output data/market/creators.json
          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/creator-market-refresh.yml/runs?status=success&per_page=1")"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty')"
          prior_time="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-creator-market -D _prior || true
            prior_state="$(find _prior -name creators.json -print -quit)"
            prior_manifest="$(find _prior -name creator_attention_manifest.json -print -quit)"
            if [ -n "$prior_manifest" ]; then cp "$prior_manifest" data/creator_attention_manifest.json; fi
            if [ -n "$prior_state" ]; then
              if [ -n "$prior_time" ] && [ "$prior_time" \> "$baseline_time" ]; then
                cp "$prior_state" data/market/creators.json
              else
                python scripts/category_market_store.py merge --base data/market/creators.json --overlay "$prior_state" --category creators --mode market
              fi
            fi
          fi
      - name: Validate Creator discovery and event pricing
        run: >-
          python -m unittest
          tests/test_discover_creators_only.py
          tests/test_creator_attention_refresh.py
          tests/test_category_market_store.py -v
      - name: Expand Creator coverage toward 1,000
        run: >-
          python scripts/expand_creator_market.py
          --baseline data/baseline_current_catalog.json
          --creator-catalog data/market/creators.json
          --manifest data/creator_discovery_manifest.json
          --target-total 1000
          --minimum-total 900
          --per-occupation-limit 1200
          --minimum-sitelinks 3
          --request-timeout 60
      - name: Refresh verified Creator audience-attention outcomes
        run: >-
          python scripts/creator_attention_refresh.py
          --catalog data/market/creators.json
          --manifest data/creator_attention_manifest.json
          --lookback-days 45
          --request-timeout 12
      - name: Append durable Creator events
        run: python scripts/append_game_event_history.py --catalog data/market/creators.json
      - name: Append dated Creator history
        run: python scripts/append_price_history.py --catalog data/market/creators.json
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-creator-market
          path: |
            data/market/creators.json
            data/creator_attention_manifest.json
            data/creator_discovery_manifest.json
          retention-days: 14