name: Add source-linked catalog batch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-catalog-expansion.yml"
      - "data/catalog_expansion_config.json"
      - "scripts/build_large_catalog_expansion.py"
  schedule:
    # Rebuild the active batch monthly without removing earlier completed batches.
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: talentx-catalog-expansion-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Rebuild curated seed
        run: python scripts/build_non_athlete_catalog.py

      - name: Add first 500-name source-linked batch
        timeout-minutes: 30
        run: >-
          python scripts/build_large_catalog_expansion.py
          --workers 16
          --request-timeout 7

      - name: Confirm batch totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/catalog_expansion_manifest.json").read_text())
          expected = int(manifest["requestedTotalAdditions"])
          generated = int(manifest["generatedTotalAdditions"])
          if expected != 500 or generated != expected:
              raise SystemExit(f"Expected 500 additions; generated {generated:,}")
          print(f"Validated {generated:,} source-linked additions")
          PY

      - name: Commit completed batch
        run: |
          if git diff --quiet -- data/current_seed.json data/catalog_expansion_manifest.json data/taxonomy.json data/non_athlete_manifest.json; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_seed.json data/catalog_expansion_manifest.json data/taxonomy.json data/non_athlete_manifest.json
          git commit -m "Add source-linked TalentX catalog batch 001"
          git push
