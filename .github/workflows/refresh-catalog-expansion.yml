name: Refresh source-linked catalog expansion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-catalog-expansion.yml"
  schedule:
    # Refresh source-linked identities monthly, separate from site deployment.
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: talentx-catalog-expansion-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Rebuild curated seed
        run: python scripts/build_non_athlete_catalog.py

      - name: Refresh 9,400 source-linked identities
        timeout-minutes: 75
        run: >-
          python scripts/build_large_catalog_expansion.py
          --workers 24
          --request-timeout 7

      - name: Confirm expansion totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/catalog_expansion_manifest.json").read_text())
          expected = int(manifest["requestedTotalAdditions"])
          generated = int(manifest["generatedTotalAdditions"])
          if expected != 9400 or generated != expected:
              raise SystemExit(f"Expected 9,400 additions; generated {generated:,}")
          print(f"Validated {generated:,} source-linked additions")
          PY

      - name: Commit refreshed expansion
        run: |
          if git diff --quiet -- data/current_seed.json data/catalog_expansion_manifest.json data/taxonomy.json data/non_athlete_manifest.json; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_seed.json data/catalog_expansion_manifest.json data/taxonomy.json data/non_athlete_manifest.json
          git commit -m "Refresh source-linked TalentX catalog"
          git push
