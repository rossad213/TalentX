# Music discovery is strict-source verified; individual sports target 200 each
name: Build current catalog baseline

on:
  push:
    branches: [main]
    paths:
      # Full baseline inputs. Category-owned market/event/history utilities are
      # explicitly excluded below so they cannot launch a 10,000-name rebuild.
      - "scripts/**"
      - "!scripts/hourly_price_refresh.py"
      - "!scripts/hourly_price_refresh_reliable.py"
      - "!scripts/game_event_history.py"
      - "!scripts/tennis_event_refresh.py"
      - "!scripts/golf_event_refresh.py"
      - "!scripts/restore_hourly_event_market_state.py"
      - "!scripts/explain_event_pricing_only.py"
      - "!scripts/append_game_event_history.py"
      - "!scripts/append_price_history.py"
      - "!scripts/merge_hourly_market_state.py"
      - "!scripts/non_athlete_event_refresh.py"
      - "!scripts/music_release_coverage_sweep.py"
      - "!scripts/non_athlete_outcome_refresh.py"
      - "!scripts/creator_attention_refresh.py"
      - "!scripts/repair_non_athlete_outcome_manifest.py"
      - "!scripts/normalize_non_athlete_event_timestamps.py"
      - "!scripts/pricing_engine_v2_catalog.py"
      - "!scripts/category_market_store.py"
      - "!scripts/backfill_price_history.py"
      - "!scripts/soccer_event_history.py"
      - "!scripts/athlete_career_event_refresh.py"
      - "!scripts/backfill_non_athlete_event_history.py"
      - "!scripts/backfill_non_athlete_outcome_history.py"
      - "!scripts/merge_historical_event_overlay.py"
      - "tests/**"
      - "!tests/test_hourly_price_refresh.py"
      - "!tests/test_non_athlete_event_refresh.py"
      - "!tests/test_non_athlete_outcome_refresh.py"
      - "!tests/test_game_event_history.py"
      - "!tests/test_tennis_event_refresh.py"
      - "!tests/test_golf_event_refresh.py"
      - "!tests/test_event_pricing_policy.py"
      - "!tests/test_category_market_store.py"
      - "!tests/test_historical_event_overlay.py"
      - "!tests/test_athlete_career_event_refresh.py"
      - "!tests/test_soccer_event_history.py"
      - "!tests/test_creator_attention_refresh.py"
      - "data/**"
      - "!data/market/**"
      - "!data/verified_non_athlete_events.json"
      - "!data/verified_athlete_events.json"
      - "requirements.txt"
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: talentx-full-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Validate category market-state composition
        run: python -m unittest tests/test_category_market_store.py -v
      - name: Validate pricing engine v2
        run: python -m unittest tests/test_pricing_engine_v2.py -v
      - name: Validate actor discovery primitives
        run: python -m unittest tests/test_expand_non_athlete_sources.py -v
      - name: Validate strict Music source discovery
        run: python -m unittest tests/test_discover_strict_music.py -v
      - name: Validate strict Music verification logic
        run: python -m unittest tests/test_strict_music_catalog.py -v
      - name: Validate discovered benchmark cleanup
        run: python -m unittest tests/test_normalize_non_athlete_benchmarks.py -v
      - name: Validate curated actor and musician enrichment logic
        run: python -m unittest tests/test_enrich_curated_non_athletes.py -v
      - name: Validate non-athlete pricing regression logic
        run: python -m unittest tests/test_validate_non_athlete_pricing.py -v
      - name: Validate individual-sport roster expansion
        run: python -m unittest tests/test_add_individual_sport_rosters.py -v
      - name: Validate 200-name individual-sport discovery logic
        run: python -m unittest tests/test_expand_individual_sport_sources.py -v
      - name: Build curated Music, Actor, and Creator rosters
        run: python scripts/build_non_athlete_catalog.py
      - name: Add source-backed actors only
        run: >-
          python scripts/discover_actors_only.py
          --actor-additions 1000
          --per-occupation-limit 900
          --minimum-sitelinks 10
          --request-timeout 60
          --allow-shortfall
      - name: Discover strictly verified musicians
        run: >-
          python scripts/discover_strict_music_ci.py
          --target-total 5000
          --minimum-total 1000
          --page-size 200
          --minimum-sitelinks 5
          --allow-shortfall
      - name: Strictly verify discovered musicians
        run: >-
          python scripts/strict_music_catalog.py
          --catalog data/current_seed.json
          --manifest data/strict_music_seed_manifest.json
          --batch-size 50
          --request-timeout 15
      - name: Keep discovered records outside curated benchmark rankings
        run: python scripts/normalize_non_athlete_benchmarks.py
      - name: Enrich existing curated musicians and actors
        run: >-
          python scripts/enrich_curated_non_athletes.py
          --workers 8
          --request-timeout 12
          --minimum-resolved 100
          --allow-shortfall
      - name: Add ranked anchor rosters for thin individual sports
        run: python scripts/add_individual_sport_rosters.py
      - name: Top up five individual-sport categories toward 200 names each
        run: >-
          python scripts/expand_individual_sport_sources.py
          --target-per-discipline 200
          --minimum-per-discipline 150
          --per-occupation-limit 440
          --page-size 220
          --minimum-sitelinks 2
          --request-timeout 45
          --allow-shortfall
      - name: Restore last successful verified athlete baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _prior_baseline
          mkdir -p _prior_baseline
          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-current-catalog-and-pages.yml/runs?status=success&per_page=1")"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty')"
          if [ -n "$prior_id" ]; then
            echo "Restoring verified athlete fallback from successful baseline run $prior_id"
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-current-catalog -D _prior_baseline || true
            prior_catalog="$(find _prior_baseline -name current_catalog.json -print -quit)"
            if [ -n "$prior_catalog" ]; then
              cp "$prior_catalog" data/prior_current_catalog.json
              echo "Prior verified baseline is available for outage recovery."
            else
              echo "Prior baseline artifact did not contain current_catalog.json; live build must meet target on its own."
            fi
          else
            echo "No prior successful baseline found; live build must meet target on its own."
          fi
      - name: Build current roster expansion from live sources
        run: python scripts/build_current_catalog.py --target-additions 10000 --workers 18 --allow-shortfall
      - name: Recover missing rosters from prior verified baseline
        run: >-
          python scripts/top_up_prior_verified_athletes.py
          --catalog data/current_catalog.json
          --fallback data/prior_current_catalog.json
          --seed data/current_seed.json
          --target-additional-athletes 10000
          --csv data/current_catalog.csv
          --manifest data/catalog_manifest.json
          --source-manifest data/current_source_manifest.json
      - name: Add priority soccer players from verified rosters
        run: python scripts/add_priority_soccer.py
      - name: Enrich source-specific career statistics and awards
        run: >-
          python scripts/enrich_current_catalog.py
          --workers 24
          --request-timeout 12
          --minimum-enriched 2500
      - name: Add structured career evidence for priority soccer players
        run: >-
          python scripts/enrich_priority_soccer_sources.py
          --catalog data/current_catalog.json
          --priority data/priority_soccer_names.json
      - name: Normalize evidence with category and discipline adapters
        run: python scripts/enrichment_framework.py --catalog data/current_catalog.json
      - name: Re-audit final Music category
        run: >-
          python scripts/strict_music_catalog.py
          --catalog data/current_catalog.json
          --manifest data/strict_music_final_manifest.json
          --batch-size 50
          --request-timeout 15
      - name: Run audited pricing engine v1 baseline
        run: python scripts/reprice_catalogs.py
      - name: Validate evidence-weighted v1 baseline
        run: >-
          python scripts/validate_pricing_model.py
          --minimum-current 10000
          --minimum-enriched 2500
          --max-identical-score-rate 0.08
      - name: Apply Talent Market Confidence pricing engine v2
        run: python scripts/pricing_engine_v2.py
      - name: Validate reviewed non-athlete pricing relationships
        run: python scripts/validate_non_athlete_pricing.py
      - name: Validate generated current catalog
        run: python scripts/validate_current_catalog.py --minimum 10000
      - name: Validate Music category consistency
        run: python scripts/validate_music_category_consistency.py
      - name: Enforce final strict Music contract
        run: python scripts/validate_strict_music_contract.py
      - name: Upload generated catalog baseline
        uses: actions/upload-artifact@v4
        with:
          name: talentx-current-catalog
          path: |
            data/current_catalog.json
            data/current_catalog.csv
            data/catalog_manifest.json
            data/current_source_manifest.json
            data/pricing_enrichment_manifest.json
            data/actor_discovery_manifest.json
            data/strict_music_discovery_manifest.json
            data/strict_music_seed_manifest.json
            data/strict_music_final_manifest.json
            data/curated_non_athlete_evidence_manifest.json
            data/individual_sport_roster_manifest.json
            data/individual_sport_discovery_manifest.json
          retention-days: 14