# Music expansion target: 5,000 total Music listings; individual sports: 200 each
name: Build current catalog and deploy TalentX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-current-catalog-and-pages.yml"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "assets/**"
      - "requirements.txt"
      - "index.html"
      - "app.js"
      - "chart-history.js"
      - "discovery-profile.js"
      - "discovery-profile.css"
      - "styles.css"
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: talentx-full-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Validate pricing engine v2
        run: python -m unittest tests/test_pricing_engine_v2.py -v
      - name: Validate actor and musician discovery logic
        run: python -m unittest tests/test_expand_non_athlete_sources.py -v
      - name: Validate large Music catalog expansion logic
        run: python -m unittest tests/test_top_up_music_catalog.py -v
      - name: Validate curated actor and musician enrichment logic
        run: python -m unittest tests/test_enrich_curated_non_athletes.py -v
      - name: Validate non-athlete pricing regression logic
        run: python -m unittest tests/test_validate_non_athlete_pricing.py -v
      - name: Validate individual-sport roster expansion
        run: python -m unittest tests/test_add_individual_sport_rosters.py -v
      - name: Validate 200-name individual-sport discovery logic
        run: python -m unittest tests/test_expand_individual_sport_sources.py -v
      - name: Build curated Music, Actor, and Creator rosters
        run: python scripts/build_non_athlete_catalog.py
      - name: Add up to 2,000 musicians and 1,000 actors
        run: >-
          python scripts/expand_non_athlete_sources.py
          --music-additions 2000
          --actor-additions 1000
          --per-occupation-limit 900
          --minimum-sitelinks 10
          --request-timeout 60
          --allow-shortfall
      - name: Top up Music catalog toward 5,000 current listings
        run: >-
          python scripts/top_up_music_catalog.py
          --target-total 5000
          --minimum-total 3500
          --per-occupation-limit 1000
          --page-size 250
          --minimum-sitelinks 5
          --request-timeout 30
          --allow-shortfall
      - name: Keep discovered records outside curated benchmark rankings
        run: python scripts/normalize_non_athlete_benchmarks.py
      - name: Enrich existing curated musicians and actors
        run: >-
          python scripts/enrich_curated_non_athletes.py
          --workers 8
          --request-timeout 12
          --minimum-resolved 100
          --allow-shortfall
      - name: Add ranked anchor rosters for thin individual sports
        run: python scripts/add_individual_sport_rosters.py
      - name: Top up five individual-sport categories toward 200 names each
        run: >-
          python scripts/expand_individual_sport_sources.py
          --target-per-discipline 200
          --minimum-per-discipline 150
          --per-occupation-limit 440
          --page-size 220
          --minimum-sitelinks 2
          --request-timeout 45
          --allow-shortfall
      - name: Build 10,000-name current roster expansion
        run: python scripts/build_current_catalog.py --target-additions 10000 --workers 18
      - name: Add priority soccer players from verified rosters
        run: python scripts/add_priority_soccer.py
      - name: Enrich source-specific career statistics and awards
        run: >-
          python scripts/enrich_current_catalog.py
          --workers 24
          --request-timeout 12
          --minimum-enriched 2500
      - name: Add structured career evidence for priority soccer players
        run: >-
          python scripts/enrich_priority_soccer_sources.py
          --catalog data/current_catalog.json
          --priority data/priority_soccer_names.json
      - name: Normalize evidence with category and discipline adapters
        run: python scripts/enrichment_framework.py --catalog data/current_catalog.json
      - name: Run audited pricing engine v1 baseline
        run: python scripts/reprice_catalogs.py
      - name: Validate evidence-weighted v1 baseline
        run: >-
          python scripts/validate_pricing_model.py
          --minimum-current 10000
          --minimum-enriched 2500
          --max-identical-score-rate 0.08
      - name: Apply Talent Market Confidence pricing engine v2
        run: python scripts/pricing_engine_v2.py
      - name: Validate reviewed non-athlete pricing relationships
        run: python scripts/validate_non_athlete_pricing.py
      - name: Validate generated current catalog
        run: python scripts/validate_current_catalog.py --minimum 10000
      - name: Upload generated catalog files
        uses: actions/upload-artifact@v4
        with:
          name: talentx-current-catalog
          path: |
            data/current_catalog.json
            data/current_catalog.csv
            data/catalog_manifest.json
            data/current_source_manifest.json
            data/pricing_enrichment_manifest.json
            data/non_athlete_discovery_manifest.json
            data/music_expansion_manifest.json
            data/curated_non_athlete_evidence_manifest.json
            data/individual_sport_roster_manifest.json
            data/individual_sport_discovery_manifest.json
          retention-days: 14
      - name: Prepare static Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js chart-history.js discovery-profile.js styles.css discovery-profile.css .nojekyll _site/
          cp -R data _site/data
          cp -R assets _site/assets
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
