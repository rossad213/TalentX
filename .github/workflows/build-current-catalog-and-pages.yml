name: Build current catalog and deploy TalentX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-current-catalog-and-pages.yml"
      - "scripts/**"
      - "data/**"
      - "requirements.txt"
      - "index.html"
      - "app.js"
      - "styles.css"
  schedule:
    # Full roster-and-pricing refresh every Sunday at 08:17 UTC.
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: talentx-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Build curated Music, Actor, and Creator rosters
        run: python scripts/build_non_athlete_catalog.py

      - name: Build 10,000-name current roster expansion
        run: python scripts/build_current_catalog.py --target-additions 10000 --workers 18

      - name: Enrich prices with career statistics and awards
        run: >-
          python scripts/enrich_current_catalog.py
          --workers 24
          --request-timeout 12
          --minimum-enriched 2500

      - name: Reprice current, legacy, and under-review catalogs
        run: python scripts/reprice_catalogs.py

      - name: Validate evidence-weighted pricing
        run: >-
          python scripts/validate_pricing_model.py
          --minimum-current 10000
          --minimum-enriched 2500
          --max-identical-score-rate 0.08

      - name: Validate generated current catalog
        run: python scripts/validate_current_catalog.py --minimum 10000

      - name: Upload generated catalog files
        uses: actions/upload-artifact@v4
        with:
          name: talentx-current-catalog
          path: |
            data/current_catalog.json
            data/current_catalog.csv
            data/catalog_manifest.json
            data/current_source_manifest.json
            data/pricing_enrichment_manifest.json
          retention-days: 14

      - name: Prepare static Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js styles.css .nojekyll _site/
          cp -R data _site/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
