name: NFL RB pricing validation

on:
  push:
    branches: [fix/nfl-rb-receiving-td-credit]
    paths:
      - "scripts/hourly_price_refresh_nfl.py"
      - "scripts/hourly_price_refresh_nfl_rb.py"
      - "tests/test_nfl_per_game_expectations.py"
      - "tests/test_nfl_rb_receiving_td_credit.py"
      - ".github/workflows/nfl-rb-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Compile corrected NFL modules
        run: python -m py_compile scripts/hourly_price_refresh_nfl.py scripts/hourly_price_refresh_nfl_rb.py
      - name: Run NFL regression tests
        run: >-
          python -m unittest
          tests/test_nfl_per_game_expectations.py
          tests/test_nfl_rb_receiving_td_credit.py
          tests/test_results_event_pricing.py
          tests/test_uncapped_sports_refresh.py -v
