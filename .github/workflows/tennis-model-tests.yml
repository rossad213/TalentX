name: Tennis model tests

on:
  pull_request:
    paths:
      - "scripts/pricing_engine_v2.py"
      - "scripts/migrate_tennis_market_state.py"
      - "scripts/reconcile_tennis_identities.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_tennis_market_state_migration.py"
      - "tests/test_tennis_identity_reconciliation.py"
      - ".github/workflows/sports-market-refresh.yml"
      - ".github/workflows/publish-market.yml"
      - ".github/workflows/tennis-model-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/pricing_engine_v2.py"
      - "scripts/migrate_tennis_market_state.py"
      - "scripts/reconcile_tennis_identities.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_tennis_market_state_migration.py"
      - "tests/test_tennis_identity_reconciliation.py"
      - ".github/workflows/sports-market-refresh.yml"
      - ".github/workflows/publish-market.yml"
      - ".github/workflows/tennis-model-tests.yml"

permissions:
  contents: read

jobs:
  tennis-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Run Tennis pricing and identity regression suite
        run: >-
          python -m unittest
          tests/test_pricing_engine_v2.py
          tests/test_tennis_market_state_migration.py
          tests/test_tennis_identity_reconciliation.py
          tests/test_tennis_event_refresh.py
          -v
