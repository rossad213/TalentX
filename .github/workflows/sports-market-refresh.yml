name: Sports market refresh

on:
  workflow_run:
    workflows: ["Build current catalog baseline"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/hourly_price_refresh.py"
      - "scripts/hourly_price_refresh_nfl.py"
      - "scripts/hourly_price_refresh_nfl_opportunity.py"
      - "scripts/hourly_price_refresh_nfl_rb.py"
      - "scripts/nfl_production_pricing.py"
      - "scripts/nfl_rookie_transition.py"
      - "scripts/sync_nfl_draft_metadata.py"
      - "scripts/repair_nfl_rookie_ipo_prices.py"
      - "scripts/repair_nfl_persisted_opportunity_prices.py"
      - "scripts/repair_nfl_production_prices.py"
      - "scripts/repair_nfl_production_prices_safe.py"
      - "scripts/repair_mlb_market_prices.py"
      - "scripts/tennis_event_refresh.py"
      - "scripts/tennis_event_refresh_results.py"
      - "scripts/golf_event_refresh.py"
      - "scripts/golf_event_refresh_results.py"
      - "scripts/athlete_career_event_refresh.py"
      - "scripts/restore_hourly_event_market_state.py"
      - "scripts/explain_event_pricing_only.py"
      - "scripts/append_game_event_history.py"
      - "scripts/append_price_history.py"
      - "scripts/category_market_store.py"
      - "data/nfl_draft_metadata_overrides.json"
      - "tests/test_hourly_price_refresh.py"
      - "tests/test_nfl_per_game_expectations.py"
      - "tests/test_nfl_rb_receiving_td_credit.py"
      - "tests/test_nfl_opportunity_protection.py"
      - "tests/test_nfl_production_pricing.py"
      - "tests/test_nfl_rookie_ipo_system.py"
      - "tests/test_nfl_fundamental_stability.py"
      - "tests/test_nfl_safe_rebase.py"
      - "tests/test_results_event_pricing.py"
      - "tests/test_uncapped_sports_refresh.py"
      - "tests/test_specialized_uncapped_results.py"
      - "tests/test_game_event_history.py"
      - "tests/test_tennis_event_refresh.py"
      - "tests/test_golf_event_refresh.py"
      - "tests/test_athlete_career_event_refresh.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_category_market_store.py"
      - ".github/workflows/sports-market-refresh.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: talentx-sports-market
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Restore Sports-owned market state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _baseline _prior _published_fallback
          mkdir -p _baseline _prior _published_fallback data/market
          printf '[]' > data/prior_sports_state.json

          source_ready=0
          baseline_id=""
          baseline_time=""
          prior_id=""
          prior_time=""

          # Prefer the latest successful full baseline when its artifact still exists.
          baseline_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-current-catalog-and-pages.yml/runs?status=success&per_page=1" 2>/dev/null || printf '{}')"
          baseline_id="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].id // empty')"
          baseline_time="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          if [ -n "$baseline_id" ]; then
            if gh run download "$baseline_id" -R "$GITHUB_REPOSITORY" -n talentx-current-catalog -D _baseline; then
              baseline_catalog="$(find _baseline -name current_catalog.json -print -quit)"
              if [ -n "$baseline_catalog" ]; then
                python scripts/category_market_store.py extract --catalog "$baseline_catalog" --category sports --output data/current_catalog.json
                source_ready=1
                echo "Restored Sports from full baseline run $baseline_id."
              else
                echo "WARNING: baseline run $baseline_id has no current_catalog.json; trying recent Sports state."
              fi
            else
              echo "WARNING: baseline artifact for run $baseline_id is unavailable/expired; trying recent Sports state."
            fi
          fi

          # A valid recent Sports artifact is authoritative for Sports and keeps this
          # workflow alive even when the old full-baseline artifact has expired.
          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sports-market-refresh.yml/runs?status=success&per_page=1" 2>/dev/null || printf '{}')"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty')"
          prior_time="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          if [ -n "$prior_id" ]; then
            if gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-sports-market -D _prior; then
              prior_state="$(find _prior -name sports.json -print -quit)"
              prior_manifest="$(find _prior -name hourly_refresh_manifest.json -print -quit)"
              if [ -n "$prior_manifest" ]; then cp "$prior_manifest" data/hourly_refresh_manifest.json; fi
              if [ -n "$prior_state" ]; then
                cp "$prior_state" data/prior_sports_state.json
                if [ "$source_ready" -eq 0 ]; then
                  cp "$prior_state" data/current_catalog.json
                  source_ready=1
                  echo "Recovered Sports directly from successful Sports run $prior_id."
                elif [ -n "$prior_time" ] && { [ -z "$baseline_time" ] || [ "$prior_time" \> "$baseline_time" ]; }; then
                  cp "$prior_state" data/current_catalog.json
                else
                  python scripts/category_market_store.py merge --base data/current_catalog.json --overlay "$prior_state" --category sports --mode market
                fi
              fi
            else
              echo "WARNING: latest successful Sports artifact could not be downloaded."
            fi
          fi

          # Last-known-good published market is the final recovery source.
          if [ "$source_ready" -eq 0 ]; then
            published_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-market.yml/runs?status=success&per_page=1" 2>/dev/null || printf '{}')"
            published_id="$(printf '%s' "$published_meta" | jq -r '.workflow_runs[0].id // empty')"
            if [ -n "$published_id" ] && gh run download "$published_id" -R "$GITHUB_REPOSITORY" -n talentx-published-market -D _published_fallback; then
              published_catalog="$(find _published_fallback -name current_catalog.json -print -quit)"
              if [ -n "$published_catalog" ]; then
                python scripts/category_market_store.py extract --catalog "$published_catalog" --category sports --output data/current_catalog.json
                source_ready=1
                echo "Recovered Sports from published market run $published_id."
              fi
            fi
          fi

          test "$source_ready" -eq 1 || { echo "No valid Sports recovery source is available."; exit 1; }

          # One-time recovery of NFL market state from the final successful Sports
          # artifact before the 3.2 pricing migration. Replacing the matching NFL
          # records (rather than only reverting source code) prevents already-migrated
          # prices/history from surviving indefinitely in the rolling Sports artifact.
          restore_version="pre-3.2-market-state-20260920"
          restore_done="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/hourly_refresh_manifest.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          except (OSError, json.JSONDecodeError):
              payload = {}
          print(payload.get("nflPre32RestoreVersion", "") if isinstance(payload, dict) else "")
          PY
          )"
          if [ "$restore_done" != "$restore_version" ]; then
            rm -rf _nfl_restore
            mkdir -p _nfl_restore
            gh run download "35550381564" -R "$GITHUB_REPOSITORY" -n talentx-sports-market -D _nfl_restore
            restore_state="$(find _nfl_restore -name sports.json -print -quit)"
            test -n "$restore_state" || { echo "Pre-3.2 NFL restore artifact is missing sports.json."; exit 1; }
            python - "$restore_state" data/current_catalog.json data/hourly_refresh_manifest.json "$restore_version" <<'PY'
          import json
          import sys
          from pathlib import Path

          snapshot_path = Path(sys.argv[1])
          catalog_path = Path(sys.argv[2])
          manifest_path = Path(sys.argv[3])
          restore_version = sys.argv[4]

          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))

          def identity(record):
              namespace = str(record.get("sourceNamespace") or "").strip().lower()
              source_id = str(record.get("sourceRecordId") or "").strip()
              if namespace and source_id:
                  return ("source", namespace, source_id)
              return ("id", str(record.get("id") or ""))

          old_nfl = {
              identity(record): record
              for record in snapshot
              if str(record.get("leagueOrMedium") or "").strip().upper() == "NFL"
          }

          restored = 0
          output = []
          for record in catalog:
              if str(record.get("leagueOrMedium") or "").strip().upper() != "NFL":
                  output.append(record)
                  continue
              prior = old_nfl.get(identity(record))
              if prior is None:
                  output.append(record)
                  continue
              replacement = dict(prior)
              # Keep the current catalog identity. The rollback is for NFL market
              # state, not for profile identifiers assigned after the snapshot.
              # Reusing historical IDs/tickers can collide with current records.
              for identity_key in ("id", "ticker", "name"):
                  if identity_key in record:
                      replacement[identity_key] = record[identity_key]
              replacement["nflPre32StateRestoreVersion"] = restore_version
              output.append(replacement)
              restored += 1

          catalog_path.write_text(
              json.dumps(output, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {}
          except (OSError, json.JSONDecodeError):
              manifest = {}
          if not isinstance(manifest, dict):
              manifest = {}
          manifest["nflPre32RestoreVersion"] = restore_version
          manifest["nflPre32RestoreSourceRunId"] = "35550381564"
          manifest["nflPre32RestoredListings"] = restored
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Restored {restored:,} NFL listing(s) from the final pre-3.2 Sports market state.")
          PY
          else
            echo "Pre-3.2 NFL market state has already been restored; keeping the rolling Sports state."
          fi

          echo "WEEKLY_BASELINE_RUN_ID=${baseline_id:-${prior_id:-}}" >> "$GITHUB_ENV"
      - name: Validate Sports pricing logic
        run: >-
          python -m unittest
          tests/test_hourly_price_refresh.py
          tests/test_nfl_per_game_expectations.py
          tests/test_nfl_rb_receiving_td_credit.py
          tests/test_nfl_opportunity_protection.py
          tests/test_nfl_production_pricing.py
          tests/test_nfl_rookie_ipo_system.py
          tests/test_nfl_fundamental_stability.py
          tests/test_nfl_safe_rebase.py
          tests/test_results_event_pricing.py
          tests/test_uncapped_sports_refresh.py
          tests/test_specialized_uncapped_results.py
          tests/test_game_event_history.py
          tests/test_tennis_event_refresh.py
          tests/test_golf_event_refresh.py
          tests/test_athlete_career_event_refresh.py
          tests/test_pricing_engine_v2.py
          tests/test_category_market_store.py -v
      - name: Sync factual NFL draft metadata
        run: python scripts/sync_nfl_draft_metadata.py --catalog data/current_catalog.json
      - name: Refresh completed-game evidence
        run: >-
          python scripts/hourly_price_refresh_nfl_rb.py
          --workers 20
          --request-timeout 10
          --lookback-hours 96
          --max-athletes 1800
          --baseline-run-id "$WEEKLY_BASELINE_RUN_ID"
      - name: Refresh verified ATP and WTA match evidence
        run: >-
          python scripts/tennis_event_refresh_results.py
          --catalog data/current_catalog.json
          --lookback-hours 120
          --request-timeout 15
      - name: Refresh verified PGA and LPGA tournament evidence
        run: >-
          python scripts/golf_event_refresh_results.py
          --catalog data/current_catalog.json
          --lookback-hours 240
          --request-timeout 15
      - name: Save authoritative Sports game-market state
        run: cp data/current_catalog.json data/sports_event_market_state.json
      - name: Recalculate Sports fair values
        run: python scripts/pricing_engine_v2_catalog.py --catalog data/current_catalog.json
      - name: Restore verified game market prices
        run: >-
          python scripts/restore_hourly_event_market_state.py
          --base data/current_catalog.json
          --snapshot data/sports_event_market_state.json
      - name: Restore NFL production-first fundamentals
        run: python scripts/repair_nfl_production_prices_safe.py --catalog data/current_catalog.json
      - name: Apply NFL Rookie IPO transition
        run: python scripts/repair_nfl_rookie_ipo_prices.py --catalog data/current_catalog.json
      - name: Explain latest game without repricing
        run: python scripts/explain_event_pricing_only.py --catalog data/current_catalog.json
      - name: Apply verified athlete signings and team changes
        run: >-
          python scripts/athlete_career_event_refresh.py
          --catalog data/current_catalog.json
          --prior data/prior_sports_state.json
          --events data/verified_athlete_events.json
      - name: Append durable Sports events
        run: python scripts/append_game_event_history.py --catalog data/current_catalog.json
      - name: Append dated Sports history
        run: python scripts/append_price_history.py --catalog data/current_catalog.json
      - name: Finalize safe MLB prices and chart history
        run: python scripts/repair_mlb_market_prices.py --catalog data/current_catalog.json
      - name: Save Sports category database
        run: cp data/current_catalog.json data/market/sports.json
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-sports-market
          path: |
            data/market/sports.json
            data/hourly_refresh_manifest.json
          retention-days: 14
