name: Sports market refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sports-market-refresh.yml"

permissions:
  actions: read
  contents: read

jobs:
  repair_nhl_only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore NHL only from clean pre-intervention state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _current _clean out
          mkdir -p _current _clean out/market

          # 716 is the latest successful Sports state before this one-time repair.
          # 711 is the last clean Sports state before the rollback intervention.
          gh run download "35878966013" -R "$GITHUB_REPOSITORY" -n talentx-sports-market -D _current
          gh run download "35803613681" -R "$GITHUB_REPOSITORY" -n talentx-sports-market -D _clean

          current_state="$(find _current -name sports.json -print -quit)"
          clean_state="$(find _clean -name sports.json -print -quit)"
          current_manifest="$(find _current -name hourly_refresh_manifest.json -print -quit)"

          test -n "$current_state" || { echo "Missing current sports.json"; exit 1; }
          test -n "$clean_state" || { echo "Missing clean sports.json"; exit 1; }
          test -n "$current_manifest" || { echo "Missing current hourly_refresh_manifest.json"; exit 1; }

          python - "$current_state" "$clean_state" out/market/sports.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          current_path = Path(sys.argv[1])
          clean_path = Path(sys.argv[2])
          output_path = Path(sys.argv[3])

          decoder = json.JSONDecoder()

          def iter_array(path, chunk_size=1024*1024):
              with path.open("r", encoding="utf-8") as fh:
                  buf = ""
                  pos = 0
                  started = False
                  eof = False
                  while True:
                      if not eof and len(buf) - pos < chunk_size:
                          chunk = fh.read(chunk_size)
                          if chunk:
                              if pos:
                                  buf = buf[pos:] + chunk
                                  pos = 0
                              else:
                                  buf += chunk
                          else:
                              eof = True
                      while True:
                          n = len(buf)
                          while pos < n and buf[pos].isspace():
                              pos += 1
                          if not started:
                              if pos < n and buf[pos] == "[":
                                  started = True
                                  pos += 1
                              elif eof:
                                  return
                              else:
                                  break
                          while pos < n and (buf[pos].isspace() or buf[pos] == ","):
                              pos += 1
                          if pos < n and buf[pos] == "]":
                              return
                          try:
                              obj, end = decoder.raw_decode(buf, pos)
                          except json.JSONDecodeError:
                              break
                          yield obj
                          pos = end
                      if eof:
                          if buf[pos:].strip():
                              raise RuntimeError(f"Incomplete JSON array in {path}")
                          return

          clean_nhl = {}
          for record in iter_array(clean_path):
              if str(record.get("leagueOrMedium") or "").strip().upper() == "NHL":
                  rid = str(record.get("id") or "")
                  if not rid or rid in clean_nhl:
                      raise RuntimeError(f"Invalid/duplicate NHL id in clean snapshot: {rid!r}")
                  clean_nhl[rid] = record

          if len(clean_nhl) != 1329:
              raise RuntimeError(f"Expected 1329 clean NHL records, found {len(clean_nhl)}")

          used = set()
          non_nhl_digest = hashlib.sha256()
          non_nhl_count = 0
          nhl_count = 0

          with output_path.open("w", encoding="utf-8") as out:
              out.write("[")
              first = True
              for record in iter_array(current_path):
                  league = str(record.get("leagueOrMedium") or "").strip().upper()
                  if league == "NHL":
                      rid = str(record.get("id") or "")
                      replacement = clean_nhl.get(rid)
                      if replacement is None:
                          raise RuntimeError(f"Current NHL id not found in clean snapshot: {rid}")
                      record_to_write = replacement
                      used.add(rid)
                      nhl_count += 1
                  else:
                      record_to_write = record
                      non_nhl_count += 1
                      canonical = json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
                      non_nhl_digest.update(canonical)
                      non_nhl_digest.update(b"\n")

                  if not first:
                      out.write(",")
                  json.dump(record_to_write, out, ensure_ascii=False, separators=(",", ":"))
                  first = False
              out.write("]")

          if nhl_count != 1329:
              raise RuntimeError(f"Expected 1329 current NHL records, found {nhl_count}")
          if used != set(clean_nhl):
              missing = sorted(set(clean_nhl) - used)[:10]
              raise RuntimeError(f"NHL replacement did not cover clean snapshot IDs; sample missing: {missing}")

          # Re-read the output and prove every non-NHL record is semantically identical
          # to the current input by hashing canonical JSON in the same record order.
          verify_digest = hashlib.sha256()
          verify_non_nhl_count = 0
          verify_nhl_count = 0
          for record in iter_array(output_path):
              if str(record.get("leagueOrMedium") or "").strip().upper() == "NHL":
                  verify_nhl_count += 1
              else:
                  verify_non_nhl_count += 1
                  canonical = json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
                  verify_digest.update(canonical)
                  verify_digest.update(b"\n")

          if verify_non_nhl_count != non_nhl_count or verify_digest.digest() != non_nhl_digest.digest():
              raise RuntimeError("Non-NHL records changed during NHL-only repair")
          if verify_nhl_count != 1329:
              raise RuntimeError(f"Output NHL count mismatch: {verify_nhl_count}")

          print(f"Restored exactly {nhl_count} NHL records from run 711.")
          print(f"Verified {non_nhl_count} non-NHL records unchanged.")
          print(f"Non-NHL semantic SHA256: {non_nhl_digest.hexdigest()}")
          PY

          cp "$current_manifest" out/hourly_refresh_manifest.json

      - name: Upload repaired Sports market
        uses: actions/upload-artifact@v4
        with:
          name: talentx-sports-market
          path: |
            out/market/sports.json
            out/hourly_refresh_manifest.json
          retention-days: 14
          if-no-files-found: error
