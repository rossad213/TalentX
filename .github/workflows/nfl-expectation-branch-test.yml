name: NFL expectation branch validation

on:
  push:
    branches: [fix/nfl-per-game-expectations]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Compile NFL refresh layer
        run: python -m py_compile scripts/hourly_price_refresh_nfl.py
      - name: Run NFL and shared Sports pricing tests
        run: >-
          python -m unittest
          tests/test_nfl_per_game_expectations.py
          tests/test_hourly_price_refresh.py
          tests/test_results_event_pricing.py
          tests/test_uncapped_sports_refresh.py -v
