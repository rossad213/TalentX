name: Basketball pathway tests

on:
  pull_request:
    paths:
      - "scripts/hourly_price_refresh.py"
      - "scripts/pricing_engine_v2.py"
      - "scripts/migrate_wnba_market_state.py"
      - "scripts/category_market_store.py"
      - "tests/test_hourly_price_refresh.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_wnba_market_state_migration.py"
      - ".github/workflows/sports-market-refresh.yml"
      - ".github/workflows/basketball-pathway-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/hourly_price_refresh.py"
      - "scripts/pricing_engine_v2.py"
      - "scripts/migrate_wnba_market_state.py"
      - "scripts/category_market_store.py"
      - "tests/test_hourly_price_refresh.py"
      - "tests/test_pricing_engine_v2.py"
      - "tests/test_wnba_market_state_migration.py"
      - ".github/workflows/sports-market-refresh.yml"
      - ".github/workflows/basketball-pathway-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Run basketball pathway regression suite
        run: >-
          python -m unittest
          tests/test_pricing_engine_v2.py
          tests/test_hourly_price_refresh.py
          tests/test_wnba_market_state_migration.py
          -v
