name: Hourly price refresh and deploy TalentX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hourly-price-refresh.yml"
      - "scripts/hourly_price_refresh.py"
      - "scripts/hourly_price_refresh_reliable.py"
      - "scripts/game_event_history.py"
      - "scripts/restore_hourly_event_market_state.py"
      - "scripts/explain_event_pricing_only.py"
      - "scripts/append_game_event_history.py"
      - "scripts/event_pricing_policy.py"
      - "scripts/pricing_engine_v2.py"
      - "scripts/append_price_history.py"
      - "scripts/merge_hourly_market_state.py"
      - "tests/test_hourly_price_refresh.py"
      - "tests/test_game_event_history.py"
      - "tests/test_event_pricing_policy.py"
      - "tests/test_pricing_engine_v2.py"
      - "index.html"
      - "app.js"
      - "chart-history.js"
      - "discovery-profile.js"
      - "discovery-profile.css"
      - "styles.css"
      - "assets/**"
  workflow_run:
    workflows: ["Build current catalog and deploy TalentX"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: talentx-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Restore latest full catalog and newer hourly overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _weekly _hourly
          mkdir -p _weekly _hourly
          cp data/taxonomy.json _weekly/repository-taxonomy.json
          weekly_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-current-catalog-and-pages.yml/runs?status=success&per_page=1")"
          weekly_run_id="$(printf '%s' "$weekly_meta" | jq -r '.workflow_runs[0].id // empty')"
          weekly_created_at="$(printf '%s' "$weekly_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          if [ -z "$weekly_run_id" ]; then echo "No successful full-catalog workflow run is available."; exit 1; fi
          gh run download "$weekly_run_id" -R "$GITHUB_REPOSITORY" -n talentx-current-catalog -D _weekly
          weekly_data_dir="$(dirname "$(find _weekly -name current_catalog.json -print -quit)")"
          if [ -z "$weekly_data_dir" ] || [ ! -f "$weekly_data_dir/current_catalog.json" ]; then echo "Weekly artifact missing current_catalog.json."; exit 1; fi
          rm -rf data; mkdir -p data
          cp -R "$weekly_data_dir"/. data/
          cp _weekly/repository-taxonomy.json data/taxonomy.json
          hourly_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/hourly-price-refresh.yml/runs?status=success&per_page=1")"
          hourly_run_id="$(printf '%s' "$hourly_meta" | jq -r '.workflow_runs[0].id // empty')"
          hourly_created_at="$(printf '%s' "$hourly_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          if [ -n "$hourly_run_id" ]; then
            gh run download "$hourly_run_id" -R "$GITHUB_REPOSITORY" -n talentx-hourly-catalog -D _hourly
            processed_manifest="$(find _hourly -name hourly_refresh_manifest.json -print -quit)"
            if [ -n "$processed_manifest" ]; then cp "$processed_manifest" data/hourly_refresh_manifest.json; fi
          fi
          if [ -n "$hourly_run_id" ] && [ "$hourly_created_at" \> "$weekly_created_at" ]; then
            for filename in current_catalog.json current_catalog.csv catalog_manifest.json current_source_manifest.json pricing_enrichment_manifest.json; do
              source_file="$(find _hourly -name "$filename" -print -quit)"; if [ -n "$source_file" ]; then cp "$source_file" "data/$filename"; fi
            done
          elif [ -n "$hourly_run_id" ]; then
            prior_hourly_catalog="$(find _hourly -name current_catalog.json -print -quit)"
            if [ -n "$prior_hourly_catalog" ]; then python scripts/merge_hourly_market_state.py --base data/current_catalog.json --overlay "$prior_hourly_catalog"; fi
          fi
          echo "WEEKLY_BASELINE_RUN_ID=$weekly_run_id" >> "$GITHUB_ENV"
      - name: Validate pricing logic
        run: python -m unittest tests/test_hourly_price_refresh.py tests/test_game_event_history.py tests/test_event_pricing_policy.py tests/test_pricing_engine_v2.py -v
      - name: Refresh completed-game evidence
        run: >-
          python scripts/hourly_price_refresh_reliable.py
          --workers 20
          --request-timeout 10
          --lookback-hours 96
          --max-athletes 1800
          --max-game-move-pct 2.5
          --baseline-run-id "$WEEKLY_BASELINE_RUN_ID"
      - name: Save authoritative game-event market state
        run: cp data/current_catalog.json data/hourly_event_market_state.json
      - name: Recalculate Talent Market Confidence fair values
        run: python scripts/pricing_engine_v2.py
      - name: Restore game-by-game market prices after fair-value calculation
        run: >-
          python scripts/restore_hourly_event_market_state.py
          --base data/current_catalog.json
          --snapshot data/hourly_event_market_state.json
      - name: Create explainable latest-event record without repricing
        run: python scripts/explain_event_pricing_only.py --catalog data/current_catalog.json
      - name: Append every dated game move to chart history
        run: python scripts/append_game_event_history.py --catalog data/current_catalog.json
      - name: Append dated price history
        run: python scripts/append_price_history.py --catalog data/current_catalog.json
      - name: Validate current catalog
        run: python scripts/validate_current_catalog.py --minimum 10000
      - name: Upload hourly catalog state
        uses: actions/upload-artifact@v4
        with:
          name: talentx-hourly-catalog
          path: |
            data/current_catalog.json
            data/current_catalog.csv
            data/catalog_manifest.json
            data/current_source_manifest.json
            data/pricing_enrichment_manifest.json
            data/hourly_refresh_manifest.json
            data/taxonomy.json
          retention-days: 10
      - name: Prepare static Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js chart-history.js discovery-profile.js styles.css discovery-profile.css .nojekyll _site/
          cp -R data _site/data
          cp -R assets _site/assets
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
