name: Creator model tests

on:
  pull_request:
    paths:
      - "scripts/discover_creators_only.py"
      - "scripts/reprice_creator_fundamentals.py"
      - "tests/test_discover_creators_only.py"
      - "tests/test_reprice_creator_fundamentals.py"
      - "data/taxonomy.json"
      - ".github/workflows/creator-market-refresh.yml"
      - ".github/workflows/creator-model-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Validate Creator discovery and fundamentals
        run: >-
          python -m unittest
          tests/test_discover_creators_only.py
          tests/test_reprice_creator_fundamentals.py -v