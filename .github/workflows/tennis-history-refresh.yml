name: Tennis history refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tennis-history-refresh.yml"
      - "market_jobs/tennis_scoreboard_history.py"
      - "market_jobs/test_tennis_scoreboard_history.py"
      - "scripts/tennis_event_refresh.py"
      - "tests/test_tennis_event_refresh.py"
      - "scripts/merge_historical_event_overlay.py"
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: talentx-tennis-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt

      - name: Validate Tennis match and history pricing logic
        run: >-
          python -m unittest
          tests/test_tennis_event_refresh.py
          market_jobs/test_tennis_scoreboard_history.py
          -v

      - name: Restore latest healthy Sports state and prior Tennis history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _sports _prior_tennis
          mkdir -p _sports _prior_tennis data

          sports_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sports-market-refresh.yml/runs?status=completed&per_page=30")"
          sports_id="$(printf '%s' "$sports_meta" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
          test -n "$sports_id" || { echo "No successful Sports market artifact exists."; exit 1; }
          gh run download "$sports_id" -R "$GITHUB_REPOSITORY" -n talentx-sports-market -D _sports
          sports_state="$(find _sports -name sports.json -print -quit)"
          test -n "$sports_state" || { echo "Sports artifact missing sports.json"; exit 1; }
          cp "$sports_state" data/sports.json

          python - <<'PY'
          import json
          from pathlib import Path
          fields=(
              "marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend",
              "lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation",
              "lastGameMovePct","lastGamePerformanceDeltaPct","lastGameStats"
          )
          records=json.loads(Path("data/sports.json").read_text())
          snap={str(r.get("id")): {k:r.get(k) for k in fields} for r in records if isinstance(r,dict) and r.get("id")}
          Path("data/tennis-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY

          tennis_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tennis-history-refresh.yml/runs?status=completed&per_page=30" || true)"
          prior_id="$(printf '%s' "$tennis_meta" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' 2>/dev/null || true)"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-tennis-history -D _prior_tennis || true
            prior_state="$(find _prior_tennis -name tennis.json -print -quit)"
            if [ -n "$prior_state" ]; then
              python scripts/merge_historical_event_overlay.py \
                --base data/sports.json \
                --overlay "$prior_state" \
                --category sports
            fi
          fi

      - name: Build verified three-year Tennis event history
        run: >-
          python market_jobs/tennis_scoreboard_history.py
          --catalog data/sports.json
          --output data/tennis.json
          --days 1095
          --request-timeout 15
          --chunk-days 28
          --max-game-move-pct 2.5
          --minimum-total-covered 50
          --ranked-gate-size 20
          --minimum-ranked-covered 12

      - name: Prove historical work did not change today's Sports market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=(
              "marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend",
              "lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation",
              "lastGameMovePct","lastGamePerformanceDeltaPct","lastGameStats"
          )
          before=json.loads(Path("data/tennis-live-fields.json").read_text())
          records=json.loads(Path("data/sports.json").read_text())
          after={str(r.get("id")): {k:r.get(k) for k in fields} for r in records if isinstance(r,dict) and r.get("id")}
          if before != after:
              raise SystemExit("Tennis history refresh changed live Sports market fields")
          print("Live Sports market fields unchanged.")
          PY

      - name: Write Tennis coverage manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path("data/tennis.json").read_text())
          def games(r):
              return [e for e in r.get("priceEvents",[]) if isinstance(e,dict) and e.get("historicalBackfill") is True and e.get("verified") is not False and str(e.get("sport") or "").lower()=="tennis" and abs(float(e.get("movePct") or 0))>=0.001]
          covered=[r for r in records if games(r)]
          ranked=sorted(
              [r for r in records if (r.get("sourceRank") or r.get("rosterSourceRank"))],
              key=lambda r:(int(r.get("sourceRank") or r.get("rosterSourceRank") or 999999), str(r.get("name") or ""))
          )[:20]
          manifest={
              "lookbackDays":1095,
              "tennisRecords":len(records),
              "coveredRecords":len(covered),
              "coveragePct":round((len(covered)/len(records)*100) if records else 0,2),
              "rankedGateCovered":sum(1 for r in ranked if games(r)),
              "rankedGateSize":len(ranked),
              "examples":[{"name":r.get("name"),"events":len(games(r)),"price":r.get("marketPrice")} for r in sorted(covered,key=lambda r:len(games(r)),reverse=True)[:30]]
          }
          Path("data/tennis_history_manifest.json").write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: talentx-tennis-history
          path: |
            data/tennis.json
            data/tennis_history_manifest.json
          retention-days: 90
