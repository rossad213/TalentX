name: Prepare uncapped pricing migration retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-uncap-retry.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove stale cap metadata and retrigger migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/non_athlete_event_refresh.py")
          text = p.read_text(encoding="utf-8")
          old = '            "maximumSingleEventMovePct": MAX_EVENT_MOVE_PCT,\n'
          new = '            "maximumSingleEventMovePct": None,\n            "movementPolicy": "verified evidence versus expectations; no fixed percentage ceiling",\n'
          if old not in text:
              raise SystemExit("expected legacy manifest cap field was not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/uncap-pricing-migration.yml")
          current = workflow.read_text(encoding="utf-8")
          marker = "# retry after manifest policy cleanup\n"
          if marker not in current:
              workflow.write_text(current + "\n" + marker, encoding="utf-8")
          PY
          git config user.name "TalentX pricing migration"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/non_athlete_event_refresh.py .github/workflows/uncap-pricing-migration.yml
          git commit -m "Remove stale movement-cap policy metadata"
          git push origin HEAD:main
