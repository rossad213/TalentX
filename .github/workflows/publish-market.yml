name: Publish unified TalentX market

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-market.yml"
      - "scripts/validate_current_catalog.py"
      - "scripts/merge_historical_event_overlay.py"
      - "index.html"
      - "site.webmanifest"
      - "app.js"
      - "chart-history.js"
      - "discovery-profile.js"
      - "discovery-profile.css"
      - "styles.css"
      - "assets/**"
  workflow_run:
    workflows:
      - "Build current catalog baseline"
      - "Sports market refresh"
      - "Music market refresh"
      - "Actor market refresh"
      - "Creator market refresh"
      - "Backfill verified 1Y event history"
    types: [completed]
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: talentx-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compose latest category-owned market states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _baseline _sports _music _actors _creators _history
          mkdir -p _baseline data/market
          baseline_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-current-catalog-and-pages.yml/runs?status=success&per_page=1")"
          baseline_id="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].id // empty')"
          baseline_time="$(printf '%s' "$baseline_meta" | jq -r '.workflow_runs[0].created_at // empty')"
          test -n "$baseline_id" || { echo "No successful full-catalog baseline exists."; exit 1; }
          gh run download "$baseline_id" -R "$GITHUB_REPOSITORY" -n talentx-current-catalog -D _baseline
          baseline_data="$(dirname "$(find _baseline -name current_catalog.json -print -quit)")"
          test -n "$baseline_data" || { echo "Baseline artifact missing current_catalog.json"; exit 1; }
          cp -R "$baseline_data"/. data/

          apply_state() {
            workflow_file="$1"
            artifact_name="$2"
            state_filename="$3"
            category="$4"
            target_dir="$5"
            required="$6"

            # Publishing is last-known-good by design. A failed/cancelled refresh
            # must never take the public market down. We still surface the newest
            # run's conclusion as a warning, but compose from the newest successful
            # artifact until the next healthy refresh replaces it.
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?status=completed&per_page=30")"
            latest="$(printf '%s' "$meta" | jq -c '.workflow_runs[0] // {}')"
            latest_id="$(printf '%s' "$latest" | jq -r '.id // empty')"
            latest_conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // empty')"

            healthy="$(printf '%s' "$meta" | jq -c '[.workflow_runs[] | select(.conclusion == "success")][0] // {}')"
            run_id="$(printf '%s' "$healthy" | jq -r '.id // empty')"
            created_at="$(printf '%s' "$healthy" | jq -r '.created_at // empty')"

            if [ -z "$run_id" ]; then
              if [ "$required" = "required" ]; then
                echo "Required ${category} market state has never produced a successful artifact."
                exit 1
              fi
              echo "No successful optional ${category} market state yet; using baseline."
              return 0
            fi

            if [ -n "$latest_id" ] && [ "$latest_id" != "$run_id" ]; then
              echo "WARNING: latest ${category} refresh ${latest_id} concluded ${latest_conclusion}; publishing last known good run ${run_id}."
            fi

            rm -rf "$target_dir"; mkdir -p "$target_dir"
            if ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "$artifact_name" -D "$target_dir"; then
              if [ "$required" = "required" ]; then
                echo "Required last-known-good ${category} artifact ${artifact_name} could not be downloaded from run ${run_id}."
                exit 1
              fi
              echo "Optional ${category} artifact unavailable; using baseline."
              return 0
            fi
            state="$(find "$target_dir" -name "$state_filename" -print -quit)"
            if [ -z "$state" ]; then
              if [ "$required" = "required" ]; then
                echo "Required last-known-good ${category} artifact had no ${state_filename}."
                exit 1
              fi
              echo "Optional ${category} artifact had no ${state_filename}; using baseline."
              return 0
            fi
            mode="market"
            if [ -n "$created_at" ] && [ "$created_at" \> "$baseline_time" ]; then mode="replace"; fi
            python scripts/category_market_store.py merge --base data/current_catalog.json --overlay "$state" --category "$category" --mode "$mode"
            echo "Published ${category} from last-known-good run ${run_id} in ${mode} mode."
          }

          apply_state sports-market-refresh.yml talentx-sports-market sports.json sports _sports required
          apply_state music-market-refresh.yml talentx-music-market music.json music _music required
          apply_state actor-market-refresh.yml talentx-actor-market actors.json actors _actors required
          apply_state creator-market-refresh.yml talentx-creator-market creators.json creators _creators optional

          # Historical backfill is an optional, history-only layer. It can never
          # replace current category state or today's market price. A failed or
          # expired history artifact simply leaves the live market untouched.
          history_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backfill-price-history.yml/runs?status=success&per_page=1")"
          history_id="$(printf '%s' "$history_meta" | jq -r '.workflow_runs[0].id // empty')"
          if [ -n "$history_id" ]; then
            mkdir -p _history/sports _history/music _history/actors _history/creators
            if gh run download "$history_id" -R "$GITHUB_REPOSITORY" -n talentx-sports-history-backfill -D _history/sports; then
              history_state="$(find _history/sports -name sports.json -print -quit)"
              if [ -n "$history_state" ]; then
                python scripts/merge_historical_event_overlay.py --base data/current_catalog.json --overlay "$history_state" --category sports
              fi
            else
              echo "WARNING: Sports history artifact unavailable; publishing live Sports state only."
            fi
            if gh run download "$history_id" -R "$GITHUB_REPOSITORY" -n talentx-music-history-backfill -D _history/music; then
              history_state="$(find _history/music -name music.json -print -quit)"
              if [ -n "$history_state" ]; then
                python scripts/merge_historical_event_overlay.py --base data/current_catalog.json --overlay "$history_state" --category music
              fi
            else
              echo "WARNING: Music history artifact unavailable; publishing live Music state only."
            fi
            if gh run download "$history_id" -R "$GITHUB_REPOSITORY" -n talentx-actor-history-backfill -D _history/actors; then
              history_state="$(find _history/actors -name actors.json -print -quit)"
              if [ -n "$history_state" ]; then
                python scripts/merge_historical_event_overlay.py --base data/current_catalog.json --overlay "$history_state" --category actors
              fi
            else
              echo "WARNING: Actor history artifact unavailable; publishing live Actor state only."
            fi
            if gh run download "$history_id" -R "$GITHUB_REPOSITORY" -n talentx-creator-history-backfill -D _history/creators; then
              history_state="$(find _history/creators -name creators.json -print -quit)"
              if [ -n "$history_state" ]; then
                python scripts/merge_historical_event_overlay.py --base data/current_catalog.json --overlay "$history_state" --category Creator
              fi
            else
              echo "WARNING: Creator history artifact unavailable; publishing live Creator state only."
            fi
            echo "Applied latest successful verified 1Y history run ${history_id}."
          else
            echo "No successful verified 1Y history run exists yet; publishing live event history only."
          fi

          # Global identity/display constraints only make sense after all category
          # databases and optional history have been recombined.
          python scripts/category_market_store.py finalize \
            --catalog data/current_catalog.json \
            --csv data/current_catalog.csv \
            --manifest data/catalog_manifest.json

          python scripts/category_market_store.py extract --catalog data/current_catalog.json --category sports --output data/market/sports.json
          python scripts/category_market_store.py extract --catalog data/current_catalog.json --category music --output data/market/music.json
          python scripts/category_market_store.py extract --catalog data/current_catalog.json --category actors --output data/market/actors.json
          python scripts/category_market_store.py extract --catalog data/current_catalog.json --category creators --output data/market/creators.json
      - name: Validate unified market
        run: |
          python -m unittest tests/test_category_market_store.py tests/test_historical_event_overlay.py -v
          python scripts/validate_current_catalog.py --minimum 10000
          node --check assets/event-timeline.js
          node --check assets/chart-visual-fixes.js
          node --check assets/event-chart-safety.js
          node --check assets/event-chart-coverage.js
      - name: Upload composed market artifact
        uses: actions/upload-artifact@v4
        with:
          name: talentx-published-market
          path: |
            data/current_catalog.json
            data/current_catalog.csv
            data/market/
          retention-days: 10
      - name: Prepare static Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html site.webmanifest app.js chart-history.js discovery-profile.js styles.css discovery-profile.css .nojekyll _site/
          cp -R data _site/data
          cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy unified TalentX market
        id: deployment
        uses: actions/deploy-pages@v4