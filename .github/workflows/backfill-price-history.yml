name: Backfill verified deep event history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-price-history.yml"
      - "scripts/backfill_price_history.py"
      - "scripts/soccer_event_history.py"
      - "scripts/backfill_non_athlete_event_history.py"
      - "scripts/backfill_non_athlete_outcome_history.py"
      - "scripts/creator_attention_refresh.py"
      - "scripts/merge_historical_event_overlay.py"
      - "scripts/validate_verified_event_history.py"
      - "chart-history.js"
      - "tests/test_soccer_event_history.py"
      - "tests/test_creator_attention_refresh.py"
  workflow_dispatch:
    inputs:
      sports_days:
        description: "Completed-event Sports lookback in days"
        required: false
        default: "1095"
      non_athlete_days:
        description: "Music/Actor release lookback in days"
        required: false
        default: "1825"
      creator_days:
        description: "Creator attention lookback in days"
        required: false
        default: "1825"
      max_athletes:
        description: "Maximum matched athletes to backfill"
        required: false
        default: "10000"
      max_music_confirmations:
        description: "Maximum new MusicBrainz release confirmations this pass"
        required: false
        default: "2400"
  schedule:
    - cron: "41 7 1 * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: talentx-history-backfill
  cancel-in-progress: false

jobs:
  sports:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Validate Sports history code
        run: |
          python -m unittest tests/test_soccer_event_history.py -v
          python -m py_compile scripts/backfill_price_history.py scripts/soccer_event_history.py scripts/validate_verified_event_history.py
      - name: Restore latest healthy Sports state and prior history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _sports _prior_history; mkdir -p _sports _prior_history data
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sports-market-refresh.yml/runs?status=success&per_page=1")"
          run_id="$(printf '%s' "$meta" | jq -r '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "No successful Sports state exists."; exit 1; }
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n talentx-sports-market -D _sports
          state="$(find _sports -name sports.json -print -quit)"
          test -n "$state" || { echo "Sports artifact missing sports.json"; exit 1; }
          cp "$state" data/sports.json

          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backfill-price-history.yml/runs?status=success&per_page=1" || true)"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-sports-history-backfill -D _prior_history || true
            prior_state="$(find _prior_history -name sports.json -print -quit)"
            if [ -n "$prior_state" ]; then
              python scripts/merge_historical_event_overlay.py --base data/sports.json --overlay "$prior_state" --category sports
            fi
          fi
      - name: Snapshot Sports live market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          rows=json.loads(Path("data/sports.json").read_text())
          snap={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          Path("data/sports-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY
      - name: Backfill three years of verified completed Sports events
        env:
          BACKFILL_DAYS: ${{ inputs.sports_days || '1095' }}
          MAX_ATHLETES: ${{ inputs.max_athletes || '10000' }}
        run: >-
          python scripts/backfill_price_history.py
          --catalog data/sports.json
          --days "$BACKFILL_DAYS"
          --workers 20
          --request-timeout 15
          --max-athletes "$MAX_ATHLETES"
          --max-game-move-pct 2.5
      - name: Enforce source/date contract and write Sports coverage report
        run: >-
          python scripts/validate_verified_event_history.py
          --catalog data/sports.json
          --category Athlete
          --rewrite
          --report data/sports_history_coverage.json
      - name: Prove Sports history did not change today's market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          before=json.loads(Path("data/sports-live-fields.json").read_text())
          rows=json.loads(Path("data/sports.json").read_text())
          after={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          if before != after: raise SystemExit("Sports history changed live market fields")
          print("Sports live market fields unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-sports-history-backfill
          path: |
            data/sports.json
            data/sports_history_coverage.json
          retention-days: 90

  music:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Validate Music history code
        run: python -m py_compile scripts/backfill_non_athlete_event_history.py scripts/backfill_non_athlete_outcome_history.py scripts/validate_verified_event_history.py
      - name: Restore latest healthy Music state and prior verified history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _music _prior_history; mkdir -p _music _prior_history data
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/music-market-refresh.yml/runs?status=success&per_page=1")"
          run_id="$(printf '%s' "$meta" | jq -r '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "No successful Music state exists."; exit 1; }
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n talentx-music-market -D _music
          state="$(find _music -name music.json -print -quit)"
          test -n "$state" || { echo "Music artifact missing music.json"; exit 1; }
          cp "$state" data/music.json

          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backfill-price-history.yml/runs?status=success&per_page=1" || true)"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-music-history-backfill -D _prior_history || true
            prior_state="$(find _prior_history -name music.json -print -quit)"
            prior_manifest="$(find _prior_history -name music_history_coverage_manifest.json -print -quit)"
            if [ -n "$prior_state" ]; then
              python scripts/merge_historical_event_overlay.py --base data/music.json --overlay "$prior_state" --category music
            fi
            if [ -n "$prior_manifest" ]; then cp "$prior_manifest" data/music_history_coverage_manifest.json; fi
          fi
      - name: Snapshot Music live market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          rows=json.loads(Path("data/music.json").read_text())
          snap={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          Path("data/music-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY
      - name: Expand five years of dual-source Music release history
        env:
          BACKFILL_DAYS: ${{ inputs.non_athlete_days || '1825' }}
          MAX_CONFIRMATIONS: ${{ inputs.max_music_confirmations || '2400' }}
        run: >-
          python scripts/backfill_non_athlete_event_history.py
          --catalog data/music.json
          --category Music
          --manifest data/music_history_coverage_manifest.json
          --days "$BACKFILL_DAYS"
          --wikidata-batch-size 45
          --request-timeout 20
          --max-music-confirmations "$MAX_CONFIRMATIONS"
          --max-events-per-record 60
          --retry-unmatched-days 30
      - name: Remove inferred outcome dates and verify exact release dates
        env:
          BACKFILL_DAYS: ${{ inputs.non_athlete_days || '1825' }}
        run: >-
          python scripts/backfill_non_athlete_outcome_history.py
          --catalog data/music.json
          --category Music
          --days "$BACKFILL_DAYS"
          --request-timeout 20
      - name: Enforce source/date contract and write Music coverage report
        run: >-
          python scripts/validate_verified_event_history.py
          --catalog data/music.json
          --category Music
          --rewrite
          --report data/music_history_coverage.json
      - name: Prove Music history did not change today's market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          before=json.loads(Path("data/music-live-fields.json").read_text())
          rows=json.loads(Path("data/music.json").read_text())
          after={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          if before != after: raise SystemExit("Music history changed live market fields")
          print("Music live market fields unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-music-history-backfill
          path: |
            data/music.json
            data/music_history_coverage_manifest.json
            data/music_history_coverage.json
          retention-days: 90

  actors:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Validate Actor history code
        run: python -m py_compile scripts/backfill_non_athlete_event_history.py scripts/backfill_non_athlete_outcome_history.py scripts/validate_verified_event_history.py
      - name: Restore latest healthy Actor state and prior verified history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _actors _prior_history; mkdir -p _actors _prior_history data
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/actor-market-refresh.yml/runs?status=success&per_page=1")"
          run_id="$(printf '%s' "$meta" | jq -r '.workflow_runs[0].id // empty')"
