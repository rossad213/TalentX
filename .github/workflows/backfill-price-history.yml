          records=json.loads(Path("data/actors.json").read_text())
          snap={str(r.get("id")): {k:r.get(k) for k in fields} for r in records if isinstance(r,dict) and r.get("id")}
          Path("data/actors-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY
      - name: Backfill one year of verified Actor releases
        env:
          BACKFILL_DAYS: ${{ inputs.days || '365' }}
        run: >-
          python scripts/backfill_non_athlete_event_history.py
          --catalog data/actors.json
          --category Actor
          --days "$BACKFILL_DAYS"
          --wikidata-batch-size 60
          --request-timeout 15
          --max-music-confirmations 0
          --max-events-per-record 20
      - name: Prove Actor live price was not changed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          before=json.loads(Path("data/actors-live-fields.json").read_text())
          records=json.loads(Path("data/actors.json").read_text())
          after={str(r.get("id")): {k:r.get(k) for k in fields} for r in records if isinstance(r,dict) and r.get("id")}
          if before != after:
              raise SystemExit("Actor historical backfill changed live market fields")
          print("Actor live market fields unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-actor-history-backfill
          path: data/actors.json
          retention-days: 90

  complete:
    runs-on: ubuntu-latest
    needs: [sports, music, actors]
    steps:
      - run: echo "Verified 1Y Sports, Music and Actor history artifacts are ready for unified publishing."
