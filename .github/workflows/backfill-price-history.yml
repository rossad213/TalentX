name: Backfill verified 1Y event history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-price-history.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary handoff guard: this shares the old Pages concurrency group so this
# tiny run cancels any legacy backfill that may still be preparing a direct Pages
# deployment. The next commit moves the real backfill to its own concurrency group.
concurrency:
  group: talentx-pages
  cancel-in-progress: true

jobs:
  disable-legacy-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy direct-deploy historical backfill is disabled; unified publishing remains authoritative."
