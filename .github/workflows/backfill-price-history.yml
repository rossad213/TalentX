          --wikidata-batch-size 45
          --request-timeout 20
          --max-music-confirmations 0
          --max-events-per-record 80
      - name: Remove inferred outcome dates and verify exact release dates
        env:
          BACKFILL_DAYS: ${{ inputs.non_athlete_days || '1825' }}
        run: >-
          python scripts/backfill_non_athlete_outcome_history.py
          --catalog data/actors.json
          --category Actor
          --days "$BACKFILL_DAYS"
          --request-timeout 20
      - name: Enforce source/date contract and write Actor coverage report
        run: >-
          python scripts/validate_verified_event_history.py
          --catalog data/actors.json
          --category Actor
          --rewrite
          --report data/actor_history_coverage.json
      - name: Prove Actor history did not change today's market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          before=json.loads(Path("data/actors-live-fields.json").read_text())
          rows=json.loads(Path("data/actors.json").read_text())
          after={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          if before != after: raise SystemExit("Actor history changed live market fields")
          print("Actor live market fields unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-actor-history-backfill
          path: |
            data/actors.json
            data/actor_history_coverage.json
          retention-days: 90

  creators:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Validate Creator history code
        run: |
          python -m unittest tests/test_creator_attention_refresh.py -v
          python -m py_compile scripts/creator_attention_refresh.py scripts/validate_verified_event_history.py
      - name: Restore latest healthy Creator state and prior verified history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _creators _prior_history; mkdir -p _creators _prior_history data
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/creator-market-refresh.yml/runs?status=success&per_page=1")"
          run_id="$(printf '%s' "$meta" | jq -r '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "No successful Creator state exists."; exit 1; }
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n talentx-creator-market -D _creators
          state="$(find _creators -name creators.json -print -quit)"
          test -n "$state" || { echo "Creator artifact missing creators.json"; exit 1; }
          cp "$state" data/creators.json
          live_manifest="$(find _creators -name creator_attention_manifest.json -print -quit)"
          if [ -n "$live_manifest" ]; then cp "$live_manifest" data/creator_history_attention_manifest.json; fi

          prior_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/backfill-price-history.yml/runs?status=success&per_page=1" || true)"
          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-creator-history-backfill -D _prior_history || true
            prior_state="$(find _prior_history -name creators.json -print -quit)"
            prior_manifest="$(find _prior_history -name creator_history_attention_manifest.json -print -quit)"
            if [ -n "$prior_state" ]; then
              python scripts/merge_historical_event_overlay.py --base data/creators.json --overlay "$prior_state" --category Creator
            fi
            if [ -n "$prior_manifest" ]; then cp "$prior_manifest" data/creator_history_attention_manifest.json; fi
          fi
      - name: Snapshot Creator live market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          rows=json.loads(Path("data/creators.json").read_text())
          snap={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          Path("data/creators-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY
      - name: Backfill five years of verified Creator attention outcomes
        env:
          BACKFILL_DAYS: ${{ inputs.creator_days || '1825' }}
        run: >-
          python scripts/creator_attention_refresh.py
          --catalog data/creators.json
          --manifest data/creator_history_attention_manifest.json
          --lookback-days "$BACKFILL_DAYS"
          --request-timeout 15
          --history-only
      - name: Enforce source/date contract and write Creator coverage report
        run: >-
          python scripts/validate_verified_event_history.py
          --catalog data/creators.json
          --category Creator
          --rewrite
          --report data/creator_history_coverage.json
      - name: Prove Creator history did not change today's market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          before=json.loads(Path("data/creators-live-fields.json").read_text())
          rows=json.loads(Path("data/creators.json").read_text())
          after={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          if before != after: raise SystemExit("Creator history changed live market fields")
          print("Creator live market fields unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: talentx-creator-history-backfill
          path: |
            data/creators.json
            data/creator_history_attention_manifest.json
            data/creator_history_coverage.json
          retention-days: 90

  complete:
    runs-on: ubuntu-latest
    needs: [sports, music, actors, creators]
    steps:
      - run: echo "Deep source-backed Sports, Music, Actor, and Creator history artifacts are ready for unified publishing."
