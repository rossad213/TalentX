          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          records=json.loads(Path("data/music.json").read_text())
          snap={str(r.get("id")): {k:r.get(k) for k in fields} for r in records if isinstance(r,dict) and r.get("id")}
          Path("data/music-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY
      - name: Expand one year of verified Music release history
        env:
          BACKFILL_DAYS: ${{ inputs.days || '365' }}
          MAX_CONFIRMATIONS: ${{ inputs.max_music_confirmations || '1200' }}
        run: >-
          python scripts/backfill_non_athlete_event_history.py
          --catalog data/music.json
          --category Music
          --manifest data/music_history_coverage_manifest.json
          --days "$BACKFILL_DAYS"
          --wikidata-batch-size 60
          --request-timeout 15
          --max-music-confirmations "$MAX_CONFIRMATIONS"
          --max-events-per-record 24
          --retry-unmatched-days 14
      - name: Add verified historical Music chart outcomes
        env:
          BACKFILL_DAYS: ${{ inputs.days || '365' }}
        run: >-
          python scripts/backfill_non_athlete_outcome_history.py
