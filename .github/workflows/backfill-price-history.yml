          prior_id="$(printf '%s' "$prior_meta" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$prior_id" ]; then
            gh run download "$prior_id" -R "$GITHUB_REPOSITORY" -n talentx-actor-history-backfill -D _prior_history || true
            prior_state="$(find _prior_history -name actors.json -print -quit)"
            if [ -n "$prior_state" ]; then
              python scripts/merge_historical_event_overlay.py --base data/actors.json --overlay "$prior_state" --category actors
            fi
          fi
      - name: Snapshot Actor live market fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fields=("marketPrice","previousMarketPrice","dailyChange","hourlyChangePct","trend","lastPriceEventAt","lastPriceEvent","lastPriceEventId","priceExplanation")
          rows=json.loads(Path("data/actors.json").read_text())
          snap={str(r.get("id")):{k:r.get(k) for k in fields} for r in rows if isinstance(r,dict) and r.get("id")}
          Path("data/actors-live-fields.json").write_text(json.dumps(snap,sort_keys=True,separators=(",",":")))
          PY
      - name: Expand five years of exact-source Actor release history
        env:
          BACKFILL_DAYS: ${{ inputs.non_athlete_days || '1825' }}
        run: >-
          python scripts/backfill_non_athlete_event_history.py
          --catalog data/actors.json
          --category Actor
