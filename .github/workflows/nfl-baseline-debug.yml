name: NFL baseline diagnostic

on:
  push:
    branches: [fix/nfl-per-game-expectations]
    paths:
      - ".github/workflows/nfl-baseline-debug.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Test Caleb prior-season ESPN baseline
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from enrich_current_catalog import ESPN_OVERVIEW, fetch_json

          def summarize(payload, label):
              print("===", label, "===")
              stats = payload.get("statistics") if isinstance(payload.get("statistics"), dict) else {}
              names = stats.get("names") or stats.get("labels") or stats.get("displayNames") or []
              for split in stats.get("splits") or []:
                  if not isinstance(split, dict):
                      continue
                  print("SPLIT", split.get("displayName"), json.dumps(dict(zip(names, split.get("stats") or split.get("values") or [])), sort_keys=True))
              game_log = payload.get("gameLog") if isinstance(payload.get("gameLog"), dict) else {}
              events = game_log.get("events") if isinstance(game_log.get("events"), dict) else {}
              print("GAME_LOG_COUNT", len(events))
              print("GAME_LOG_KEYS", list(events.keys())[:25])

          base = ESPN_OVERVIEW.format(sport="football", league="nfl", athlete_id="4431611")
          summarize(fetch_json(base, 20), "default")
          summarize(fetch_json(base + "?season=2025", 20), "season=2025")
          summarize(fetch_json(base + "?season=2024", 20), "season=2024")
          PY
