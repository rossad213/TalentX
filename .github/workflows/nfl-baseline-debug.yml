name: NFL baseline diagnostic

on:
  push:
    branches: [fix/nfl-per-game-expectations]
    paths:
      - ".github/workflows/nfl-baseline-debug.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Probe ESPN season statistics endpoints
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json, requests
          urls = [
            "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2025/types/2/athletes/4431611/statistics?lang=en&region=us",
            "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/types/2/athletes/4431611/statistics?lang=en&region=us",
            "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/4431611/stats?season=2025",
            "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/4431611/gamelog?season=2025",
          ]
          for url in urls:
              print("URL", url)
              try:
                  r=requests.get(url,timeout=20,headers={"User-Agent":"TalentX-Debug/1.0","Accept":"application/json"})
                  print("STATUS", r.status_code, "LEN", len(r.text))
                  if r.ok:
                      p=r.json()
                      print("TOP_KEYS", list(p.keys())[:30] if isinstance(p,dict) else type(p).__name__)
                      text=json.dumps(p,sort_keys=True)
                      for needle in ("gamesPlayed","passingYards","passingTouchdowns","interceptions","rushingYards","rushingTouchdowns","season"):
                          i=text.find(needle)
                          if i>=0:
                              print("HIT", needle, text[max(0,i-250):i+700])
                  else:
                      print("BODY", r.text[:500])
              except Exception as exc:
                  print("ERROR", type(exc).__name__, str(exc))
          PY
