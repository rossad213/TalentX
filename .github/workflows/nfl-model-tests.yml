name: NFL model tests

on:
  pull_request:
    paths:
      - "scripts/nfl_production_pricing.py"
      - "scripts/nfl_rb_cohort_calibration.py"
      - "scripts/hourly_price_refresh_nfl_opportunity.py"
      - "scripts/repair_nfl_persisted_opportunity_prices.py"
      - "scripts/repair_nfl_production_prices.py"
      - "scripts/repair_nfl_production_prices_safe.py"
      - "scripts/migrate_nfl_v2_market_state.py"
      - "scripts/nfl_metric_calibration.py"
      - "scripts/pricing_engine_v2.py"
      - "scripts/pricing_model.py"
      - "tests/test_nfl_production_pricing.py"
      - "tests/test_nfl_fundamental_stability.py"
      - "tests/test_nfl_safe_rebase.py"
      - "tests/test_nfl_rookie_usage_handoff.py"
      - "tests/test_nfl_rb_receiving_td_credit.py"
      - "tests/test_nfl_rb_cohort_calibration.py"
      - "tests/test_nfl_v2_market_state_migration.py"
      - "tests/test_nfl_metric_calibration.py"
      - "tests/test_nfl_established_evidence.py"
      - "tests/test_hourly_price_refresh.py"
      - "tests/test_pricing_engine_v2.py"
      - ".github/workflows/sports-market-refresh.yml"
      - ".github/workflows/nfl-model-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Validate NFL fundamentals and event safeguards
        run: >-
          python -m unittest
          tests/test_nfl_production_pricing.py
          tests/test_nfl_fundamental_stability.py
          tests/test_nfl_safe_rebase.py
          tests/test_nfl_rookie_usage_handoff.py
          tests/test_nfl_rb_receiving_td_credit.py
          tests/test_nfl_rb_cohort_calibration.py
          tests/test_nfl_opportunity_protection.py
          tests/test_nfl_per_game_expectations.py
          tests/test_nfl_v2_market_state_migration.py
          tests/test_nfl_metric_calibration.py
          tests/test_nfl_established_evidence.py
          tests/test_hourly_price_refresh.py
          tests/test_pricing_engine_v2.py -v
